[build-system]
requires = [
  "uv_build>=0.12.13,<0.14.0",
]
build-backend = "uv_build"

[project]
name = "numword-georgia"
version = "0.4.0"
description = "Convert numbers to words in Georgian"
license = "MIT OR Apache-2.0"
license-files = [
  "LICENSE-MIT",
  "LICENSE-APACHE",
]
authors = [
  { name = "Sergei Blinov", email = "blinovsv@gmail.com" },
]
readme = "README.md"
keywords = [
  "numword",
  "numbers",
  "georgia",
]
requires-python = ">=3.11"
classifiers = [
  "Development Status :: 4 - Beta",
  "Programming Language :: Python",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Programming Language :: Python :: Implementation :: CPython",
  "Programming Language :: Python :: Implementation :: PyPy",
  "Typing :: Typed",
  "Topic :: Software Development :: Libraries :: Python Modules",
]
dependencies = []

  [project.urls]
  Changelog     = "https://github.com/awnion/numword-georgia/blob/main/CHANGELOG.md"
  Documentation = "https://github.com/awnion/numword-georgia/#readme"
  Homepage      = "https://github.com/awnion/numword-georgia"
  Issues        = "https://github.com/awnion/numword-georgia/issues"
  Repository    = "https://github.com/awnion/numword-georgia"
  Source        = "https://github.com/awnion/numword-georgia"

[dependency-groups]
dev = [
  "coverage[toml]>=6.5",
  "numpy>=2.4.6; implementation_name == 'cpython'",
  "pytest",
  "ruff>=0.9",
  "taplo",
  "ty",
]

[tool.ruff]
line-length = 120

  [tool.ruff.format]
  quote-style = "preserve"

  [tool.ruff.lint]
  select = [
    "A",
    "ARG",
    "B",
    "C4",
    "DTZ",
    "E",
    "EM",
    "F",
    "FBT",
    "FURB",
    "I",
    "ICN",
    "ISC",
    "N",
    "PERF",
    "PIE",
    "PL",
    "PT",
    "PTH",
    "Q",
    "RET",
    "RUF",
    "S",
    "SIM",
    "T10",
    "T20",
    "TID",
    "UP",
    "W",
    "YTT",
  ]
  ignore = [
    # Conflicts with the formatter
    "ISC001",
    # Ignore complexity
    "PLR0911",
    "PLR0912",
    "PLR0913",
    "PLR0915",
  ]

    [tool.ruff.lint.isort]
    known-first-party = [
      "numword_georgia",
    ]

    [tool.ruff.lint.flake8-tidy-imports]
    ban-relative-imports = "all"

    [tool.ruff.lint.per-file-ignores]
    # Tests can use magic values and assertions
    "tests/**/*" = [
      "PLR2004",
      "S101",
    ]

[tool.ty.environment]
python-version = "3.11"

[tool.pytest.ini_options]
addopts   = "--doctest-modules"
testpaths = ["src", "tests"]

[tool.coverage.run]
source_pkgs = [
  "numword_georgia",
]
branch = true

[tool.coverage.report]
show_missing = true
fail_under   = 100
